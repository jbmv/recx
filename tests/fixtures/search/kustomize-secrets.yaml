recx: "0.1"
name: kustomize-secrets
summary: A kustomize plugin that fills Kubernetes YAML manifests with secrets from Vault.
description: |
  Placeholders in Kubernetes manifests are replaced at build time with values
  read from HashiCorp Vault, so secrets never land in git. Works as a
  kustomize generator and as a standalone filter over YAML on stdin.
license: Apache-2.0
status: experimental
capabilities:
  - replace placeholders in Kubernetes YAML with secrets from Vault
  - run as a kustomize generator plugin
languages: [go]
tags: [kubernetes, kustomize, vault, secrets, yaml]
modules:
  - id: plugin
    path: cmd/kustomize-secrets/
    summary: The plugin binary, also usable as a stdin filter.
    language: go
    interface:
      type: cli
      entrypoints:
        - "kustomize build --enable-alpha-plugins ."
        - "kustomize-secrets < deployment.yaml"
    extract:
      method: package
      package: pkg:golang/github.com/harborline/kustomize-secrets
